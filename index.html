<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment KOMANG</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: monospace;
      text-align: center;
      background-color: #87ceeb;
      background-image: linear-gradient(45deg, #add8e6 25%, transparent 25%),
                        linear-gradient(-45deg, #add8e6 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #add8e6 75%),
                        linear-gradient(-45deg, transparent 75%, #add8e6 75%);
      background-size: 40px 40px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .screen {
      background: #fff;
      border: 3px solid #000;
      padding: 30px;
      max-width: 300px;
      box-shadow: 4px 4px 0 #000;
      display: none;
    }
    h1 { font-size: 22px; margin-bottom: 20px; }
    button {
      border: 2px solid #000;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
      cursor: pointer;
      font-family: monospace;
      width: 100%;
      box-shadow: 2px 2px 0 #000;
    }
    .btn-main { background: #000; color: #fff; }
    .btn-main:hover { background: #333; }
    .btn-wa { background: #25d366; color: #fff; }
    .btn-wa:hover { background: #1da851; }
    .btn-back { background: #ff4747; color: #fff; }
    .btn-back:hover { background: #cc3838; }
    .number-box {
      margin-top: 15px;
      font-size: 18px;
      padding: 10px;
      border: 2px solid #000;
      background: #d0f0ff;
    }
    .loading-text {
      font-size: 26px;
      font-weight: bold;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }
    /* Toast notif */
    #toast {
      visibility: hidden;
      min-width: 200px;
      background: #000;
      color: #fff;
      text-align: center;
      border: 2px solid #fff;
      border-radius: 4px;
      padding: 10px;
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      z-index: 1;
    }
    #toast.show {
      visibility: visible;
      animation: fadein 0.5s, fadeout 0.5s 2s;
    }
    @keyframes fadein {
      from { bottom: 0; opacity: 0; }
      to { bottom: 30px; opacity: 1; }
    }
    @keyframes fadeout {
      from { bottom: 30px; opacity: 1; }
      to { bottom: 0; opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- LOADING -->
  <div class="screen" id="loading-screen" style="display:block;">
    <div class="loading-text">LOADING...</div>
  </div>

  <!-- MENU -->
  <div class="screen" id="menu-screen">
    <h1>PAYMENT KOMANG</h1>
    <button class="btn-main" onclick="goToPayment()">CEK PAYMENT</button>
  </div>

  <!-- PAYMENT -->
  <div class="screen" id="payment-screen">
    <h1>PILIH PAYMENT</h1>
    <button class="btn-main" onclick="showDana()">DANA</button>
    <div id="dana-info" style="display:none;">
      <div class="number-box">081529753782</div>
      <button class="btn-main" onclick="copyNumber()">SALIN NOMOR</button>
      <p>Kirim serta bukti TF nya ya</p>
      <button class="btn-wa" onclick="window.location.href='https://wa.me/6285808408009'">
        WhatsApp KOMANG
      </button>
    </div>
    <button class="btn-back" onclick="goBack()">BACK</button>
  </div>

  <!-- Toast -->
  <div id="toast">Nomor DANA berhasil disalin!</div>

  <script>
    // Loading 3 detik
    window.onload = function() {
      setTimeout(() => {
        document.getElementById("loading-screen").style.display = "none";
        document.getElementById("menu-screen").style.display = "block";
      }, 3000);
    };

    function goToPayment() {
      document.getElementById("menu-screen").style.display = "none";
      document.getElementById("payment-screen").style.display = "block";
    }

    function goBack() {
      document.getElementById("payment-screen").style.display = "none";
      document.getElementById("menu-screen").style.display = "block";
      document.getElementById("dana-info").style.display = "none";
    }

    function showDana() {
      document.getElementById("dana-info").style.display = "block";
    }

    function copyNumber() {
      navigator.clipboard.writeText("081529753782");
      showToast();
    }

    function showToast() {
      var toast = document.getElementById("toast");
      toast.className = "show";
      setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2500);
    }
  </script>
</body>
</html>
